[project]
name = "secretyaml"
version = "26.10.0"
description = "Carica file YAML risolvendo i tag !secret da una sorgente esterna (es. ~/.secrets)"
authors = [
    {name = "Francesco Maida",email = "francesco.maida@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
secrets = "secretyaml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.poetry]
packages = [{include = "secretyaml", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
